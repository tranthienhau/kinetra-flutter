<body class="bg-surface-container-high flex justify-center items-center min-h-screen p-0 sm:p-4 select-none font-body antialiased">

<span class="material-symbols-outlined text-[24px]">arrow_back</span>

<!-- Brand Center Placeholder / Spacer -->

          Skip

</div>
<!-- Step Counter & Multi-segment Progress Bar -->
<div class="w-full mt-1">
<div class="flex justify-between items-center mb-2">
<span class="font-label text-label text-text-secondary font-medium">Step 2 of 3</span>
<span class="font-caption text-caption text-text-tertiary">Goal Setup</span>
</div>
<!-- 3-Segment Progress Pills (2 filled with dark olive #647D00, 3rd unfilled #E2E7D2) -->
<div class="grid grid-cols-3 gap-2 w-full">
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-border-hairline"></div>
</div>
</div>
</header>
<!-- Scrollable Canvas Area -->
<div class="flex-1 overflow-y-auto no-scrollbar px-gutter pt-5 pb-space-lg flex flex-col justify-start">
<!-- Screen Headline -->
<div class="mb-5">

          What is your main goal?

<p class="font-body text-body text-text-secondary mt-1 text-[15px] leading-snug">
          Select what you want to prioritize first.
        </p>
</div>
<!-- Goal Selection Cards (2x2 Grid) -->
<div class="grid grid-cols-2 gap-3.5 w-full">
<!-- Card 1: 'Build strength' - SELECTED STATE -->

<img alt="Authentic photograph of an athlete performing a heavy barbell deadlift in modern fitness gym with natural sunlight" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9R077obqX6SPUfMWSRMRYXNszkMbVnAM4dFLqBhh4K_cEbn5bDIHPOwZcBpE8uJuQqE5HXg9XHVujDPXfuQRy_PRGGu23I7E9n4xUS1DM7aHRgHtMjp6J6KYOjuMorYgax8emIi0RggDul6spx_GvJM0RU2EYWiU6H7reNvl4QpZ_wULZaLHazu32ja41CYpBIB1c6QN2EPA-XIstKKN3gkKoExLlaxhD7WgzbbJR1SikMo4mflDiPWrc4pv5sT7BhyDIJVB9oeMwOQ"/>

<!-- Label Section -->

<span class="font-title text-[15px] font-semibold text-ink leading-tight">
              Build strength
            </span>
</div>
</div>
<!-- Card 2: 'Lose weight' - Unselected State -->

<!-- Label Section -->

<!-- Label Section -->

</div>
<!-- Label Section -->
<div class="px-1.5 pt-2.5 pb-1 flex items-center justify-between">
<span class="font-title text-[15px] font-medium text-ink leading-tight">
              Stay active
            </span>
</div>
</div>
</div>
<!-- Workouts per week Section -->
<div class="mt-7 w-full">
<div class="flex items-baseline justify-between mb-2.5">

            Workouts per week

</div>
<!-- Segmented Control Container (track: surface-alt, pill-shaped) -->
<div class="w-full h-13 bg-surface-alt rounded-full p-1.5 flex items-center justify-between gap-1 border border-border-hairline">
<!-- Item 2 (Unselected) -->
<button class="flex-1 h-10 rounded-full flex items-center justify-center font-body text-[15px] font-medium text-text-secondary hover:text-ink transition-colors" type="button">

            6
          </button>
</div>
<!-- Section Caption -->
<p class="font-caption text-caption text-text-tertiary mt-2 text-center">
          You can change this later
        </p>
</div>
</div>
<!-- Docked Bottom CTA Area (Strict safety margins: clearing bottom home indicator ~34px) -->
<footer class="w-full flex-none px-gutter pb-[34px] pt-3 bg-gradient-to-t from-background via-background/95 to-transparent">
<!-- Primary Pill Button: 56px tall, neon chartreuse fill, ink label 16/600 -->
<button class="w-full h-14 rounded-full bg-accent-neon hover:bg-[#b8e600] active:scale-[0.98] active:bg-[#b8e600] text-ink font-body text-[16px] font-semibold flex items-center justify-center gap-2 shadow-sm transition-all duration-150" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px] font-semibold">arrow_forward</span>
</button>
<!-- iOS Home Indicator bar simulator for exact visual authenticity -->
<div class="w-32 h-1 bg-ink/20 rounded-full mx-auto mt-4"></div>
</footer>
</main>
<script>
    // Lightweight interactivity for segmented control items
    document.querySelectorAll('.h-13 button').forEach((btn) => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.h-13 button').forEach(b => {
          b.className = 'flex-1 h-10 rounded-full flex items-center justify-center font-body text-[15px] font-medium text-text-secondary hover:text-ink transition-colors';
          const innerSpan = b.querySelector('span');
          if (innerSpan) {
            b.innerHTML = innerSpan.textContent;
          }
        });
        this.className = 'flex-1 h-10 rounded-full bg-ink flex items-center justify-center shadow-sm';
        const num = this.textContent.trim();
        this.innerHTML = `<span class="font-body text-[15px] font-bold text-accent-neon tabular-nums">${num}</span>`;
      });
    });
  </script>
</body></html>
